name: Independent browser HTTP fixes on Linux

# CI transport only. Product files are patched into a separate fixed-base tree.
on:
  push:
    branches:
      - experiment/browser-http-split-linux-2026-10-26

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: browser-http-split-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  FORCE_COLOR: 0
  PUPPETEER_SKIP_DOWNLOAD: true
  HARNESS: .github/experiments/http-split-linux-2026-10-26
  SOURCE_BASE: 346bace62a480837302c9c820db0858d6e377e1b

jobs:
  http-tests:
    name: HTTP suite, full build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out CI transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Verify transport and prepare isolated candidate
        id: candidate
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/http-split-linux-evidence"
          source_dir="$RUNNER_TEMP/http-split-source"
          mkdir -p "$evidence"
          npm install --global npm@11.12.1 --no-audit --no-fund
          test "$(node --version)" = v24.15.0
          test "$(npm --version)" = 11.12.1
          node "$HARNESS/verify.mjs" transport "$GITHUB_WORKSPACE"
          git worktree add --detach "$source_dir" "$SOURCE_BASE"
          git -C "$source_dir" apply --index "$GITHUB_WORKSPACE/$HARNESS/candidate.patch"
          node "$HARNESS/verify.mjs" source "$source_dir"
          cp -R "$HARNESS" "$evidence/as-run"
          cp .github/workflows/browser-http-split-linux.yml "$evidence/workflow.yml"
          printf 'SOURCE_DIR=%s\n' "$source_dir" >> "$GITHUB_ENV"
          printf 'EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"

      - name: Record Linux environment
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          {
            date --iso-8601=seconds
            uname -a
            cat /etc/os-release
            id
            node --version
            npm --version
            git rev-parse HEAD
            git write-tree
            findmnt -T "$SOURCE_DIR"
            df -h "$SOURCE_DIR"
          } 2>&1 | tee "$EVIDENCE_DIR/environment.log"
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0

      - name: Install dependencies and build
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          npm run build:test --workspace @puppeteer/browsers 2>&1 | tee "$EVIDENCE_DIR/build-test.log"
          node "$EVIDENCE_DIR/as-run/verify.mjs" before "$SOURCE_DIR" "$EVIDENCE_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/inputs-before.log"

      - name: Run the entire HTTP test file
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          node node_modules/mocha/bin/mocha.js --no-config --require source-map-support/register \
            --timeout 5000 --reporter json packages/browsers/test/build/httpUtil.test.js \
            > "$EVIDENCE_DIR/http.json" 2> "$EVIDENCE_DIR/http-stderr.log"

      - name: Run repository unit tests
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          npm run unit 2>&1 | tee "$EVIDENCE_DIR/unit.log"

      - name: Regenerate and run all Angular unit tests
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR/packages/ng-schematics"
          node ../../node_modules/typescript/bin/tsc --build test/tsconfig.json --force \
            2>&1 | tee "$EVIDENCE_DIR/angular-build.log"
          node --test --test-reporter=spec "test/build/**/*.test.js" \
            2>&1 | tee "$EVIDENCE_DIR/angular-unit.log"

      - name: Verify executed test counts
        run: |
          set -euo pipefail
          node "$EVIDENCE_DIR/as-run/verify.mjs" audit "$SOURCE_DIR" "$EVIDENCE_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/test-counts.log"

      - name: Verify unchanged candidate after tests
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: |
          set -euo pipefail
          node "$EVIDENCE_DIR/as-run/verify.mjs" after "$SOURCE_DIR" "$EVIDENCE_DIR" \
            2>&1 | tee "$EVIDENCE_DIR/inputs-after.log"

      - name: Upload logs and exact inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-http-split-linux
          path: ${{ runner.temp }}/http-split-linux-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
