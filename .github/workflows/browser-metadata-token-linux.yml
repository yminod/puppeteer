name: Production metadata token candidate on Linux

on:
  push:
    branches:
      - experiment/browser-metadata-token-linux-2026-10-12

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: metadata-token-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: true
  FORCE_COLOR: 0
  SOURCE_BASE: 6c525bc1ed41075a673c48180297d15b7b0d001f
  HARNESS: .github/experiments/metadata-token-linux-2026-10-12

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'

      - name: Verify transport and create isolated exact candidate
        run: |
          mkdir "$RUNNER_TEMP/metadata-token-evidence"
          evidence_dir="$RUNNER_TEMP/metadata-token-evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git diff --name-only "$SOURCE_BASE" HEAD | sort > "$evidence_dir/transport-actual.txt"
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(process.argv[1])); console.log(m.transportPaths.join("\n"));' "$HARNESS/manifest.json" | sort > "$evidence_dir/transport-expected.txt"
          diff -u "$evidence_dir/transport-expected.txt" "$evidence_dir/transport-actual.txt"
          npm install --global npm@11.12.1 --no-audit --no-fund
          {
            date --iso-8601=seconds
            uname -a
            cat /etc/os-release
            id
            node --version
            npm --version
            findmnt -T "$evidence_dir"
            git rev-parse HEAD
          } | tee "$evidence_dir/environment.log"
          test "$(uname -m)" = x86_64
          test "$(id -u)" != 0
          test "$(findmnt -n -o FSTYPE -T "$evidence_dir")" = ext4
          test "$(node --version)" = v24.15.0
          test "$(npm --version)" = 11.12.1
          git worktree add --detach "$RUNNER_TEMP/metadata-token-source" "$SOURCE_BASE"
          git -C "$RUNNER_TEMP/metadata-token-source" apply --check "$GITHUB_WORKSPACE/$HARNESS/candidate.patch"
          git -C "$RUNNER_TEMP/metadata-token-source" apply "$GITHUB_WORKSPACE/$HARNESS/candidate.patch"
          cp -R "$HARNESS" "$evidence_dir/as-run"
          cp .github/workflows/browser-metadata-token-linux.yml "$evidence_dir/workflow.yml"

      - name: Independently install and build source and tests
        run: |
          evidence_dir="$RUNNER_TEMP/metadata-token-evidence"
          cd "$RUNNER_TEMP/metadata-token-source"
          npm ci --no-audit --no-fund 2>&1 | tee "$evidence_dir/npm-ci.log"
          npm run build --workspace @puppeteer/browsers 2>&1 | tee "$evidence_dir/build.log"
          npm run build:test --workspace @puppeteer/browsers 2>&1 | tee "$evidence_dir/build-test.log"

      - name: Verify exact source and independently compiled bytes
        id: inputs
        run: |
          node "$RUNNER_TEMP/metadata-token-evidence/as-run/verify.mjs" verify \
            "$RUNNER_TEMP/metadata-token-source" "$RUNNER_TEMP/metadata-token-evidence" \
            2>&1 | tee "$RUNNER_TEMP/metadata-token-evidence/inputs.log"

      - name: Run all 41 Cache and token helper tests
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: |
          evidence_dir="$RUNNER_TEMP/metadata-token-evidence"
          cd "$RUNNER_TEMP/metadata-token-source/packages/browsers"
          node ../../node_modules/mocha/bin/mocha.js --no-config --no-package \
            --require source-map-support/register --timeout 10000 --reporter json \
            test/build/Cache.test.js test/build/metadataLock.test.js \
            > "$evidence_dir/focused.json" 2> "$evidence_dir/focused-stderr.log"

      - name: Execute native SIGINT recovery and concurrent metadata updates
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: |
          evidence_dir="$RUNNER_TEMP/metadata-token-evidence"
          node "$evidence_dir/as-run/native.mjs" "$evidence_dir/native" "$RUNNER_TEMP/metadata-token-source" \
            2>&1 | tee "$evidence_dir/native.log"

      - name: Run the full browsers package including real extractors and launch
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: |
          evidence_dir="$RUNNER_TEMP/metadata-token-evidence"
          cd "$RUNNER_TEMP/metadata-token-source"
          npm test --workspace @puppeteer/browsers 2>&1 | tee "$evidence_dir/package.log"

      - name: Audit all cases, fixture metadata, owned closes and unchanged inputs
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        run: |
          node "$RUNNER_TEMP/metadata-token-evidence/as-run/verify.mjs" audit \
            "$RUNNER_TEMP/metadata-token-source" "$RUNNER_TEMP/metadata-token-evidence" \
            2>&1 | tee "$RUNNER_TEMP/metadata-token-evidence/audit.log"

      - name: Preserve full evidence including failed cases and hidden files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metadata-token-linux
          path: ${{ runner.temp }}/metadata-token-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
